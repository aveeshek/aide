name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1-5"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install OpenWiki
        run: npm install --global openwiki

      - name: Run OpenWiki
        run: openwiki code --update --print
        env:
          OPENWIKI_PROVIDER: ${{ vars.OPENWIKI_PROVIDER }}
          OPENWIKI_MODEL_ID: ${{ vars.OPENWIKI_MODEL_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENWIKI_TELEMETRY_DISABLED: "1"

      - name: Create documentation pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "docs(openwiki): refresh generated engineering documentation"
          title: "docs(openwiki): refresh generated engineering documentation"
          body: |
            Automated OpenWiki refresh. Generated documentation is derived and requires review.
            Canonical knowledge remains under `wiki/`.
          branch: automation/openwiki-update
          delete-branch: true
          add-paths: |
            openwiki
            AGENTS.md
            CLAUDE.md
