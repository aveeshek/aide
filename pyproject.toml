[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bos-aide-loop-graph-engineering"
version = "1.0.1"
description = "Native-Windows graph-governed spec-driven loop engineering knowledge plane for Kiro"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "graphiti-core==0.29.2",
  "mcp[cli]==1.28.1",
  "neo4j>=5.26,<6",
  "orjson>=3.10,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "PyYAML>=6,<7",
  "tenacity>=9,<10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=0.26,<1",
  "ruff>=0.12,<1",
]
docs = ["zensical==0.0.51"]

[project.scripts]
knowledge-plane-mcp = "knowledge_plane.server:main"
knowledge-plane-ingest = "knowledge_plane.ingest:main"
knowledge-plane-validate = "knowledge_plane.validate:main"
knowledge-plane-loop = "knowledge_plane.loop_contract:main"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_plane"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
